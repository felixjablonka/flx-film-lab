name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS 26 and its Xcode 26, the SDK the app is developed and tested
    # with: SwiftUI behaves as the SDK an app is built with, and 1.1.0, built
    # on macOS 15 with its SDK, lost the sliders' double-click reset. Named,
    # not macos-latest, so a new default cannot change the SDK unnoticed.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build the app and the command-line tools
        run: |
          ./build.sh
          ./build.sh lut
          ./build.sh render

      # Each suite is its own step, and each failed check is reported by name
      # (tools/ci/run-suite.sh). Every suite runs even after one fails; the
      # 4K speed check only reports on CI.
      - name: Invariant checks
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh checks
      - name: Parity with spektrafilm
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh parity
      - name: App checks
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh apptest
      - name: LUT checks
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh lutchecks
      - name: Video checks
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh motiontest
      - name: Motion app checks
        if: ${{ !cancelled() }}
        run: tools/ci/run-suite.sh motionapptest
